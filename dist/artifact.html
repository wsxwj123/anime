/* Cinematic player, one deliberate dark look.
   Layout: a 16:9 stage letterboxed in the window; overlay drawn in a fixed 1920×1080 design space. */
:root {
  --bg: #010306;
  --ink: #eaf3f7;
  --ink-dim: rgba(234, 243, 247, 0.62);
  --ink-faint: rgba(234, 243, 247, 0.28);
  --gold: #e8c47f;
  --cyan: #7fe6ff;
  --rose: #ff86b8;
  --line: rgba(234, 243, 247, 0.55);
  --f-serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', serif;
  --f-sans: 'Noto Sans SC', 'Source Han Sans SC', 'PingFang SC', 'Microsoft YaHei', 'WenQuanYi Zen Hei', sans-serif;
  --f-latin: 'Jost', 'Futura', 'Avenir Next', 'Noto Sans SC', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: dark;
}

html,
body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

#app {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--bg);
}

#stage {
  position: relative;
  width: var(--sw, 100vw);
  height: var(--sh, 56.25vw);
  overflow: hidden;
  background: #000;
  flex: none;
}

#gl {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

#ov {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  transform-origin: 0 0;
  transform: scale(var(--k, 1));
  pointer-events: none;
  font-family: var(--f-sans);
}

/* ---------- labels ---------- */
.ov-lines {
  position: absolute;
  inset: 0;
  overflow: visible;
}
.lbl-line {
  stroke: var(--line);
  stroke-width: 1.3;
  fill: none;
}
.lbl-dot {
  fill: var(--ink);
}
.lbl-ring {
  fill: none;
  stroke: var(--ink);
  stroke-width: 1.2;
}
.ov-labels {
  position: absolute;
  inset: 0;
}
.lbl {
  position: absolute;
  left: 0;
  top: 0;
  white-space: nowrap;
  will-change: transform, opacity;
}
.lbl-zh {
  position: absolute;
  bottom: 12px;
  left: 0;
  font-family: var(--f-sans);
  font-weight: 500;
  font-size: 25px;
  letter-spacing: 0.06em;
  color: var(--ink);
  text-shadow: 0 1px 14px rgba(0, 0, 0, 0.75);
}
.lbl-en {
  position: absolute;
  top: 11px;
  left: 0;
  font-family: var(--f-latin);
  font-weight: 400;
  font-size: 13.5px;
  letter-spacing: 0.22em;
  color: var(--ink-dim);
  text-shadow: 0 1px 10px rgba(0, 0, 0, 0.8);
}
.lbl.brk .lbl-zh {
  bottom: 4px;
  font-size: 23px;
  color: var(--gold);
}
.lbl.brk .lbl-en {
  top: 6px;
}
.lbl.left .lbl-zh,
.lbl.left .lbl-en {
  left: auto;
  right: 0;
  text-align: right;
}

/* ---------- chapter heading ---------- */
.chap {
  position: absolute;
  left: 92px;
  top: 74px;
}
.chap-act {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--f-latin);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.42em;
  color: var(--gold);
  opacity: 0.85;
  margin-bottom: 18px;
}
.chap-act span:last-child {
  font-family: var(--f-sans);
  font-weight: 400;
  letter-spacing: 0.3em;
}
.chap-act i {
  width: 28px;
  height: 1px;
  background: var(--gold);
  opacity: 0.6;
}
.chap-row {
  display: flex;
  align-items: center;
  gap: 22px;
}
.chap-num {
  font-family: var(--f-latin);
  font-weight: 200;
  font-size: 64px;
  line-height: 1;
  letter-spacing: 0.02em;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.chap-bar {
  width: 1px;
  height: 56px;
  background: linear-gradient(to bottom, transparent, var(--ink-faint), transparent);
}
.chap-zh {
  font-family: var(--f-serif);
  font-weight: 600;
  font-size: 34px;
